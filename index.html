<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BNS Neo Crit Calc</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Georgia, "Times New Roman", serif;
      background: #111827;
      color: #f8fafc;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      background: radial-gradient(circle at top, #334155, #111827 60%);
    }

    main {
      width: min(90vw, 42rem);
      padding: 3rem;
      border: 1px solid #64748b;
      border-radius: 8px;
      background: rgb(15 23 42 / 85%);
      box-shadow: 0 1.5rem 4rem rgb(0 0 0 / 30%);
      text-align: center;
    }

    h1 {
      margin: 0 0 1rem;
      color: #fbbf24;
      font-size: clamp(2rem, 8vw, 4rem);
    }

    p {
      margin: 0;
      color: #cbd5e1;
      font: 1.1rem/1.6 system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <main>
    <h1>BNS Neo Crit Calc</h1>
    <p>Test index page is live.</p>
  </main>
</body>
</html>
